[package]
name = "sidereon-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sidereon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sidereon = { path = "../sidereon", version = "0.20.0" }
